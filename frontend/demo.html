<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleya demo - kako radi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/kaleya-pages.css">
</head>
<body>
    <div class="page">
        <header class="nav">
            <div class="nav-inner">
                <a class="brand" href="index.html">
                    <img src="logo.png" alt="Kaleya">
                    <span>Kaleya<small>aikaleya.com</small></span>
                </a>
                <div class="nav-actions">
                    <select id="pageLangSelect" class="lang-select" onchange="setPageLang(this.value)">
                        <option value="en" selected>EN</option>
                        <option value="sr">SR</option>
                        <option value="es">ES</option>
                        <option value="pt">PT</option>
                        <option value="ru">RU</option>
                        <option value="fr">FR</option>
                        <option value="it">IT</option>
                        <option value="de">DE</option>
                    </select>
                    <button class="theme-btn" onclick="togglePageTheme()" aria-label="Dark light"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4l-.7-.7M6.3 6.3l-.7-.7m12.8 0l-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                    <a class="icon-link" href="index.html" aria-label="Početna"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></a>
                </div>
            </div>
        </header>

        <main class="wrap hero">
            <span class="eyebrow" data-i18n="demo_badge">Klikabilan demo</span>
            <h1 data-i18n="demo_title">Kako Kaleya radi u praksi</h1>
            <p class="lead" data-i18n="demo_lead">Mobilni i laptop prikaz su demo okruženje. Dugmad su klikabilna, a glas se pušta iz MP3 fajla.</p>

            <section class="grid demo-grid">
                <div class="phone device-app">
                    <div class="phone-top">
                        <strong data-i18n="mobile_title">Klijent app</strong>
                        <button class="app-theme-toggle" onclick="toggleDeviceTheme(this)" aria-label="App dark light"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4l-.7-.7M6.3 6.3l-.7-.7m12.8 0l-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                    </div>
                    <div class="phone-main app-main">
                        <div class="app-screen app-home active">
                            <div class="assistant-orb" onclick="playKaleyaDemo()" role="button" tabindex="0"><img src="logo.png" alt="Kaleya"></div>
                            <div class="quick-grid">
                                <button class="quick" onclick="setDemoStatus('status_scheduled')"><span data-i18n="schedule">Zakaži</span><span>15:00</span></button>
                                <button class="quick" onclick="setDemoStatus('status_cancelled')"><span data-i18n="cancel">Otkaži</span><span>Demo</span></button>
                                <button class="quick" onclick="setDemoStatus('status_checked')"><span data-i18n="check">Proveri</span><span>3</span></button>
                            </div>
                            <div class="home-list" data-home-list></div>
                        </div>
                        <div class="app-screen app-calendar">
                            <div class="calendar-head">
                                <button class="cal-arrow" onclick="moveCalendar(this, -1)">‹</button>
                                <strong data-calendar-label>Kalendar</strong>
                                <button class="cal-arrow" onclick="moveCalendar(this, 1)">›</button>
                            </div>
                            <div class="segmented calendar-segment">
                                <button class="active" onclick="switchCalendarMode(this, 'month')" data-i18n="month">Mesec</button>
                                <button onclick="switchCalendarMode(this, 'day')" data-i18n="day">Dan</button>
                            </div>
                            <div class="calendar-month active">
                                <div class="calendar-grid" data-calendar-grid></div>
                            </div>
                            <div class="calendar-day">
                                <div class="day-list" data-day-list></div>
                            </div>
                        </div>
                    </div>
                    <div class="app-footer">
                        <button class="app-footer-item active" onclick="switchAppView(this, 'home')"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav_home">Početna</span></button>
                        <button class="app-footer-item" onclick="switchAppView(this, 'calendar')"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18M5 19h14V7H5z"/></svg><span data-i18n="nav_calendar">Kalendar</span></button>
                        <button class="app-footer-item" disabled><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5h.1a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v.1a1.7 1.7 0 001.5 1h.1a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span data-i18n="nav_settings">Podešavanja</span></button>
                    </div>
                </div>

                <div class="laptop">
                    <div class="laptop-screen device-app">
                        <div class="toolbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
                            <h2 data-i18n="laptop_title">Klijent app</h2>
                            <button class="app-theme-toggle" onclick="toggleDeviceTheme(this)" aria-label="App dark light"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.4 6.4l-.7-.7M6.3 6.3l-.7-.7m12.8 0l-.7.7M6.3 17.7l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button>
                        </div>
                        <div class="card app-main" style="margin-top:20px;">
                            <div class="app-screen app-home active">
                            <div class="assistant-orb" style="width:150px;height:150px;margin-top:8px;" onclick="playKaleyaDemo()" role="button" tabindex="0"><img src="logo.png" alt="Kaleya"></div>
                            <div class="quick-grid">
                                <button class="quick" onclick="setDemoStatus('status_scheduled')"><span data-i18n="schedule">Zakaži</span><span>15:00</span></button>
                                <button class="quick" onclick="setDemoStatus('status_cancelled')"><span data-i18n="cancel">Otkaži</span><span>Demo</span></button>
                                <button class="quick" onclick="setDemoStatus('status_checked')"><span data-i18n="check">Proveri</span><span>3</span></button>
                            </div>
                            <div class="home-list" data-home-list></div>
                            </div>
                            <div class="app-screen app-calendar">
                                <div class="calendar-head">
                                    <button class="cal-arrow" onclick="moveCalendar(this, -1)">‹</button>
                                    <strong data-calendar-label>Kalendar</strong>
                                    <button class="cal-arrow" onclick="moveCalendar(this, 1)">›</button>
                                </div>
                                <div class="segmented calendar-segment">
                                    <button class="active" onclick="switchCalendarMode(this, 'month')" data-i18n="month">Mesec</button>
                                    <button onclick="switchCalendarMode(this, 'day')" data-i18n="day">Dan</button>
                                </div>
                                <div class="calendar-month active">
                                    <div class="calendar-grid" data-calendar-grid></div>
                                </div>
                                <div class="calendar-day">
                                    <div class="day-list" data-day-list></div>
                                </div>
                            </div>
                            <div class="app-footer">
                                <button class="app-footer-item active" onclick="switchAppView(this, 'home')"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav_home">Početna</span></button>
                                <button class="app-footer-item" onclick="switchAppView(this, 'calendar')"><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3M3 11h18M5 19h14V7H5z"/></svg><span data-i18n="nav_calendar">Kalendar</span></button>
                                <button class="app-footer-item" disabled><svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 01-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 01-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 012.8-2.8l.1.1a1.7 1.7 0 001.8.3h.1a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5h.1a1.7 1.7 0 001.8-.3l.1-.1a2 2 0 012.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8v.1a1.7 1.7 0 001.5 1h.1a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span data-i18n="nav_settings">Podešavanja</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="wrap">
                <span>© 2026 Kaleya AI</span>
                <span><a href="privacy.html" data-i18n="footer_privacy">Privatnost</a> · <a href="terms.html" data-i18n="footer_terms">Uslovi</a></span>
            </div>
        </footer>
    </div>
    <audio id="kaleyaAudio" preload="auto"></audio>
    <script src="assets/js/kaleya-pages.js"></script>
</body>
</html>
