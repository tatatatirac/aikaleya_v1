server {
    listen 80;
    server_name aikaleya.com www.aikaleya.com staging.aikaleya.com;

    client_max_body_size 25M;

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* ^/(Dockerfile|Procfile|serverless\.ya?ml|firebase-debug\.log|sendgrid\.env|aws/credentials|functions/\.runtimeconfig\.json|server-status|server-info|graphql|graphiql|openapi\.json|swagger-ui\.html|v2/api-docs|_cat/indices) {
        return 404;
    }

    location /assets/ {
        alias /var/www/aikaleya/frontend/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /logo.png {
        alias /var/www/aikaleya/frontend/logo.png;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.ico {
        alias /var/www/aikaleya/frontend/logo.png;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /static/ {
        alias /var/www/aikaleya/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/aikaleya/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
