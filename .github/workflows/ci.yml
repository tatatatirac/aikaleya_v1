name: Kaleya CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  django:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      AI_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      ELEVENLABS_API_KEY: ""
      ELEVENLABS_VOICE_ID: ""
      PAYMENT_PROVIDER: manual
      LEMONSQUEEZY_WEBHOOK_SECRET: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python backend/manage.py check

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python backend/manage.py test billing ai_agent appointments clients communications notifications support accounts staff_services integrations
